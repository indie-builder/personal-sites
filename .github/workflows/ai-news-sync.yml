name: AI news sync

on:
  schedule:
    # 7 天回填，每天 20:17 UTC = 北京时间 04:17；5 分钟增量由 Supabase Cron 负责。
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "跑 7 天回填而非增量同步"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @site/content...
      - name: Backfill (7d window)
        if: github.event.schedule == '17 20 * * *' || inputs.backfill == true
        run: node tools/content/scripts/ai-news-sync.mjs --backfill
      - name: Incremental sync (24h window)
        if: github.event.schedule != '17 20 * * *' && inputs.backfill != true
        run: node tools/content/scripts/ai-news-sync.mjs

      # A failed/older deployment must never authorize deletion. Export still runs so recovery can proceed.
      - name: Prune only the archive confirmed on production
        if: github.event.schedule == '17 20 * * *' || inputs.backfill == true
        continue-on-error: true
        run: pnpm ai-news:prune -- --apply
      - name: Archive historical public items
        if: github.event.schedule == '17 20 * * *' || inputs.backfill == true
        run: pnpm ai-news:archive
      - name: Open archive publication PR
        if: github.event.schedule == '17 20 * * *' || inputs.backfill == true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="codex/ai-news-archive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add data/ai-news.sqlite
          if git diff --cached --quiet; then exit 0; fi
          pnpm git:safety
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(ai-news): 归档历史每日动态"
          git push origin "$branch"
          cat > /tmp/ai-news-archive-pr.md <<'BODY'
          将昨日及以前的公开每日动态增量归档到 SQLite，保留既有历史并刷新旧条目的修订。

          合并并部署后，下一次清理任务会核对线上归档摘要，只删除内容一致且超过三天的云端记录。未部署或记录已变更时保留云端数据。

          验证：公开字段校验、SQLite integrity_check、Git 数据安全检查。
          BODY
          gh pr create --base "$GITHUB_BASE" --head "$branch" --title "chore(ai-news): 归档历史每日动态" --body-file /tmp/ai-news-archive-pr.md
