name: Android tests

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # JVM 单测、静态 UI 检查与仪器化测试（模拟器）都进远程门禁。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Drop machine-specific daemon JVM path
        # gradle.properties 的 org.gradle.java.home 指向作者本机 JDK 路径；
        # CI 删除该行后由 setup-java 注入的 JAVA_HOME 决定 daemon JVM。
        run: sed -i '/^org.gradle.java.home/d' android/gradle.properties
      - name: Build and run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Check centralized typography
        working-directory: android
        run: node scripts/check-typography.mjs
      - name: Install ffmpeg
        # 首跑发现 ubuntu-latest 镜像不含 ffmpeg（check-opening-frames 依赖）。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check opening GIF frames
        working-directory: android
        run: node scripts/check-opening-frames.mjs
      - name: Enable KVM group perms
        # 首跑发现 runner 用户无 /dev/kvm 权限，模拟器回退 TCG 软件仿真启动超时。
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        # 仪器化测试（AskScreen 等）用 OkHttp 拦截器自 mock SSE，不触网；
        # minSdk 31，选 runner 镜像现成的 API 34 google_apis x86_64 系统镜像。
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest --console=plain
            # 顺带在已启动的模拟器上执行问候布局检查（三个 UI 检查脚本的最后一个）。
            ./scripts/ci-greeting-check.sh
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
