name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint all code
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Install Chromium and system dependencies
        run: pnpm --filter @site/web exec playwright install --with-deps chromium
      - name: Build and test public Web flows
        # No production secrets: the fixture serves empty news increments over the committed SQLite archive.
        # Keep build and E2E in one step so the fixture is ready first and always cleaned up.
        env:
          SUPABASE_URL: http://127.0.0.1:7101
          SUPABASE_PUBLISHABLE_KEY: ci-public-data
        run: |
          node apps/web/scripts/ci-public-data.mjs > ci-public-data.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:7101/rest/v1/ai_news_public_items
          pnpm build
          PLAYWRIGHT_REUSE_BUILD=1 pnpm test:e2e ask-flow.spec.ts assistant-drawer.spec.ts ask-scroll-to-latest.spec.ts --pass-with-no-tests
          # e2e 运行器自起 7100 生产服务器；CI 只跑不依赖 BigModel 与管理端 Supabase 凭据的已搬迁用例。
          E2E_TELEMETRY_DISABLED=1 pnpm --filter @site/web exec e2e run e2e/entry-metadata.e2e.ts e2e/retired-works.e2e.ts
      - name: Upload Web E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-failure
          path: |
            apps/web/test-results/
            ci-public-data.log
          if-no-files-found: ignore
          retention-days: 7
