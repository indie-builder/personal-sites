packages:
  - apps/*
  - packages/*
  - tools/content

allowBuilds:
  '@openuidev/lang-core': false
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.51.0
  - shadcn@4.21.1
  - '@earendil-works/pi-agent-core@1.0.2'
  - '@earendil-works/pi-ai@1.0.2'
  - '@earendil-works/pi-client@1.0.2'
  - '@earendil-works/pi-coding-agent@1.0.2'
  - '@earendil-works/pi-protocol@1.0.2'
  - '@earendil-works/pi-telemetry@1.0.2'
  - '@earendil-works/pi-tui@1.0.2'
  - '@ai-sdk/anthropic@4.0.71'
  - '@ai-sdk/gateway@4.0.103'
  - ai@7.0.127
  - '@ai-sdk/provider-utils@5.0.53'
  - '@ai-sdk/provider@4.0.21'
  - '@earendil-works/chord@1.0.2'
  - '@earendil-works/pi-codemode@1.0.2'
  - '@earendil-works/pi-mcp@1.0.2'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - effect@4.0.0
  - next@16.3.8
  - turbo@2.11.7
  - vitest@5.0.3
  - '@types/node@26.6.4'
  - 'motion@14.0.0'
  - 'framer-motion@14.0.0'
  - 'motion-dom@14.0.0'
  - 'motion-utils@14.0.0'
  - 'portless@0.15.7'
  - 'vite@8.3.2'
  - hono@4.13.13
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  adm-zip: 0.6.1
  '@hono/node-server': 1.19.17
  fast-uri: 3.1.8
  hono: 4.13.13
  'sharp@<0.35.5': 0.35.5
  qs: 6.16.0
  ip-address: 10.7.3
  brace-expansion: 5.0.12
peerDependencyRules:
  allowedVersions:
    # @shadcn/lint 的 typescript-eslint 是永不触发的 fallback parser（运行时走 oxc-parser），
    # 上游 peer 上限 <6.1.0 尚未放开 TS7，允许全项目统一 typescript@7。
    '@typescript-eslint/parser>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
