packages:
  - packages/*

allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.25.0
  - shadcn@4.13.1
  - '@earendil-works/pi-agent-core@0.84.4'
  - '@earendil-works/pi-ai@0.84.4'
  - '@earendil-works/pi-client@0.84.4'
  - '@earendil-works/pi-coding-agent@0.84.4'
  - '@earendil-works/pi-protocol@0.84.4'
  - '@earendil-works/pi-telemetry@0.84.4'
  - '@earendil-works/pi-tui@0.84.4'
  - '@ai-sdk/anthropic@4.0.63'
  - '@ai-sdk/gateway@4.0.92'
  - ai@7.0.114
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  adm-zip: 0.6.0
  '@hono/node-server': 1.19.15
  fast-uri: 3.1.5
  hono: 4.12.34
  'sharp@<0.35.0': 0.35.4
peerDependencyRules:
  allowedVersions:
    # @shadcn/lint 的 typescript-eslint 是永不触发的 fallback parser（运行时走 oxc-parser），
    # 上游 peer 上限 <6.1.0 尚未放开 TS7，允许全项目统一 typescript@7。
    '@typescript-eslint/parser>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
