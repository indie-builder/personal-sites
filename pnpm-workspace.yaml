packages:
  - apps/*
  - packages/*
  - tools/content

allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.25.0
  - shadcn@4.13.1
  - '@earendil-works/pi-agent-core@0.99.2'
  - '@earendil-works/pi-ai@0.99.2'
  - '@earendil-works/pi-client@0.99.2'
  - '@earendil-works/pi-coding-agent@0.99.2'
  - '@earendil-works/pi-protocol@0.99.2'
  - '@earendil-works/pi-telemetry@0.99.2'
  - '@earendil-works/pi-tui@0.99.2'
  - '@ai-sdk/anthropic@4.0.71'
  - '@ai-sdk/gateway@4.0.102'
  - ai@7.0.126
  - '@ai-sdk/provider-utils@5.0.53'
  - '@ai-sdk/provider@4.0.21'
  - '@earendil-works/chord@0.99.2'
  - '@earendil-works/pi-codemode@0.99.2'
  - '@earendil-works/pi-mcp@0.99.2'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - effect@4.0.0
  - next@16.3.8
  - turbo@2.11.6
  - vitest@5.0.3
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  adm-zip: 0.6.0
  '@hono/node-server': 1.19.15
  fast-uri: 3.1.5
  hono: 4.12.34
  'sharp@<0.35.0': 0.35.4
peerDependencyRules:
  allowedVersions:
    # @shadcn/lint 的 typescript-eslint 是永不触发的 fallback parser（运行时走 oxc-parser），
    # 上游 peer 上限 <6.1.0 尚未放开 TS7，允许全项目统一 typescript@7。
    '@typescript-eslint/parser>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
